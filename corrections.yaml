# Hand corrections to the model's answers, laid over the cache every time it
# is read. Running the model again never overwrites them. If the model's answer
# changes so that a correction no longer fits, the cards stage stops and says so.
#
# One entry per sentence, written exactly as in the game (full-width spaces).
# All parts are optional except `sentence`; `why` is for the reader.
#
#   - sentence: …
#     why: …
#     english: …              # the sentence's translation
#     kanji: …                # the sentence in kanji
#     words:                  # a word, by its form in the sentence
#       - surface: して       #   (nth: 2 for the second して)
#         in_context: …       #   any of the word's fields
#         new_surface: …      #   the form itself, when the model wrote one
#                             #   that is not in the sentence
#     breakdown:              # a line of the sentence breakdown, by its Japanese
#       - jp: つかいます
#         en: …
#     patterns:               # a grammar pattern, by its span
#       - span: …
#         explanation: …      #   and/or name
#         drop: true          #   or take it out: the sentence has no such pattern
#     note: …                 # the sentence's note; "" removes the model's

- sentence: どうぐの　いれかえや　たいせつな　ものを　とうろくして　つかいます
  why: >-
    The model wrote "you register it and then use it", which reads as two things
    the SELECT button does. The button only uses the item; registering is done
    from the item's menu in the Bag (pokefirered, src/item_menu.c). The て form
    here sets up the state the main verb happens in. The breakdown said
    "registering a Key Item and / using it", the same two-jobs reading. A later
    re-analysis translated the sentence that way again, so the translation is
    fixed here too.
  english: Used for rearranging items, and for using a Key Item you have registered.
  breakdown:
    - jp: たいせつな　ものを　とうろくして
      en: having registered a Key Item,
    - jp: つかいます
      en: you use it
  patterns:
    - span: とうろくして　つかいます
      explanation: >-
        The て form sets up what comes first: having done one thing, you do the
        next. とうろくして　つかいます = 'having registered it, you use it'.

# Mom's line by the TV. テレビの　はなしよ means her remark was about the
# programme she is watching. "I'm talking about the TV!" reads as the TV set.

- sentence: …　そうね　おとこのこは　いつか　たびに　でるもの　なのよ　うん…　テレビの　はなしよ！
  why: >-
    The model wrote "All boys … I'm talking about the TV!". "All" is not in the
    Japanese (it is in the official English line), and the last sentence reads
    as if she meant the television set.
  english: "...Right. Boys set out on a journey someday; that's just how it is. Mm... I mean on TV!"
  breakdown:
    - jp: テレビの　はなしよ！
      en: I mean on TV!

- sentence: …　そうね　おんなのこって　いつも　たびを　ゆめみて　いるものよ　うん…　テレビの　はなしよ！
  why: The same last sentence as the boy's version of this line.
  english: "...Right. Girls are always dreaming of going on a journey. Mm... I mean on TV!"
  breakdown:
    - jp: テレビの　はなしよ！
      en: I mean on TV!

# レポート. The name check makes every translation say "save", and a few came
# back stiff ("the Pokémon Save"). The Japanese says "report" each time: these
# keep both.

- sentence: ここまでの　かつやくを　ポケモンレポートに　かきこみますか？
  why: The model wrote "write your progress so far into the Pokémon Save".
  english: Would you like to save your progress so far to the Pokémon Report?

- sentence: レッド　は　レポートに　しっかり　かきのこした！
  why: The model wrote "wrote it all down in the Save".
  english: Red saved the game, writing it all down in the report!

- sentence: まえに　かかれた　レポートに　うえから　かいても　いいですか？
  why: The model wrote "write over the previously written Save".
  english: Is it OK to save over the report written before?

- sentence: 『つづきから　はじめる』で　ぼうけんしていた　レポートが　かかれています！
  why: The model wrote "A Save from the adventure you were playing".
  english: There is already a save here, the report of the adventure you were playing with "Continue"!

- sentence: ②「はい」を　えらぶと　レポートに　ぼうけんが　きろく　されます。
  why: The model wrote "is recorded in the Save".
  english: 2. When you choose "Yes", your adventure is saved to the report.

- sentence: とうろくが　かわりました　ポケモンレポートに　かきこみますか？
  why: The model wrote "Write it to the Pokémon Save?".
  english: The registered text has changed. Save it to the Pokémon Report?

- sentence: ゲームの　けっかを　ポケモンレポートに　かきこんでいます　しばらく　おまちください
  why: The model wrote "to your Pokémon Save".
  english: Saving the game results to the Pokémon Report. Please wait a moment.

# A form the model wrote that is not in the sentence: the card could not mark it.

- sentence: ナウイことば
  why: The game writes ナウイ in katakana throughout; the model wrote ナウい.
  words:
    - surface: ナウい
      new_surface: ナウイ


# Settings in the options screen. On a bare label the meaning line is all the
# card has, and "Set battle style" or "one-handed button mode" says nothing to
# someone who does not know the setting. What each does is taken from the Help
# menu's own definitions (Help_Text_DefineBattleStyle, Help_Text_DefineButtonMode);
# the English names are the English game's (SET, LR, L=A).

- sentence: かちぬき
  why: >-
    The model wrote "Set battle style (no switch offer)" and "Set (winner stays
    in, no switching)". You can still switch on your own turn: what the setting
    turns off is the question after a knock-out (「かちぬき」では　きいてきません。).
  english: Set (the winner stays in; you are not asked whether to switch)
  words:
    - surface: かちぬき
      literal: "winning through: the winner stays on for the next opponent"
      in_context: >-
        the battle rule under which your Pokémon stays in after a knock-out: the
        game does not ask whether you want to switch (SET in the English game;
        the other rule, いれかえ, asks every time)

- sentence: 「かちぬき」では　きいてきません。
  why: The same word on the Help deck's card, which said "Set (battle style)".
  words:
    - surface: かちぬき
      literal: "winning through: the winner stays on for the next opponent"
      in_context: >-
        かちぬき, the battle rule under which your Pokémon stays in after a
        knock-out (SET in the English game)

- sentence: ＬＲ
  why: >-
    The model wrote "L/R button mode", which does not say what the mode does
    (「ＬＲ」は　ずかん　や　バッグなどで　さゆうに　きりかえる　ことが　できる　ボタン。).
  english: LR (L and R flip through pages and pockets)
  words:
    - surface: ＬＲ
      in_context: >-
        the button setting in which L and R flip left and right through the
        Pokédex's pages, the Bag's pockets and the like

- sentence: かたて
  why: >-
    The model wrote "one-handed button mode" and "One-handed (L=A)", which
    leaves "L=A" unexplained (「かたて」は　Ｌボタンが　Ａボタンと　おなじに　なり
    ほとんどの　ばしょで　かたてだけで　そうさ　できる　ようになります。).
  english: "One-handed (L=A: the L Button works as the A Button)"
  words:
    - surface: かたて
      in_context: >-
        the button setting for playing with one hand: the L Button works the
        same as the A Button (L=A in the English game)

# Two pages of a message that the deck joins into one sentence, because the
# first has no full stop. The second page opens with a word that the model
# read as the end of the first.

- sentence: やれやれ…　まったく　しょうがない　ヤツじゃのう　レッド！
  why: >-
    The model wrote "You really are a hopeless one, Red!", as if Oak were
    scolding the player. The game clears the box after ヤツじゃのう and shows the
    name alone on the next page (gText_ForPetesSake): Oak sighs about the rival,
    who has just forced a battle on you (…ちょっと　おれの　あいて　してみろ！), and
    then turns to you. ヤツ is said of someone, not to them.
  english: "Good grief... What a hopeless fellow he is. Red!"
  words:
    - surface: しょうがない
      in_context: hopeless (said of the rival)
    - surface: ヤツ
      in_context: fellow (the rival, Oak's grandson)
    - surface: じゃ
      in_context: is
    - surface: のう
      in_context: isn't he (= なあ, a sigh)
    - surface: レッド
      in_context: Red (he turns to you; the game shows this on the next page)
  breakdown:
    - jp: まったく　しょうがない　ヤツじゃのう
      en: what a hopeless fellow he is (the rival, who has just forced a battle on you)
    - jp: レッド！
      en: Red! (turning to you)
  patterns:
    - span: ヤツじゃのう
      explanation: >-
        じゃ is the old-man way of saying だ, 'is', and のう is his version of なあ,
        a sigh over what he has just seen. ヤツ is how you speak of someone, not
        to them: he means the rival. ヤツじゃのう = 'what a fellow he is'.

- sentence: シルバースプレーは　よわい　ポケモンが　とびでて　こなくなる　ほう！
  why: >-
    The model read ほう as 方 and wrote "Super Repel is the one that stops weak
    Pokémon from jumping out!". The game clears the box after こなくなる; ほう！
    opens the next page (ほう！　むしよけスプレーの　きょうりょくな　やつだな) and is the
    cry of someone who has just understood something. The English game has
    "…Hmm, it's a more powerful REPEL."
  english: Super Repel stops weak Pokémon from jumping out at you. Oh!
  words:
    - surface: ほう
      jmdict_id: 2771030
      sense: 1
      kanji: ""
      literal: oh; ho (surprise or interest)
      in_context: oh! (he has just understood what it is)
  breakdown:
    - jp: ほう！
      en: oh!
  patterns:
    - span: よわい　ポケモンが　とびでて　こなくなる　ほう
      drop: true
