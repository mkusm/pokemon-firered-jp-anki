# Names the game has no list of, by what the English game calls them. Kept by
# hand; each was checked against the English script line that pairs with a
# Japanese line saying it.
#
# An entry is the English name, or {en: the name, note: …} where a learner may
# not know the thing: something from Japan, from the real world, or from
# another Pokémon game. The note goes on the card.

# People. The player and the rival are not here: レッド and
# グリーン are defaults the player types over, and stay Red and Green.
# マチス is Surge: the rank is a separate word in both scripts.
person:
  オーキド: Oak
  タケシ: Brock
  カスミ: Misty
  マチス: Surge
  エリカ: Erika
  キョウ: Koga
  ナツメ: Sabrina
  カツラ: Blaine
  サカキ: Giovanni
  カンナ: Lorelei
  シバ: Bruno
  キクコ: Agatha
  ワタル: Lance
  マサキ: Bill
  ナナミ: Daisy
  フジろうじん: Mr. Fuji
  フジ: Fuji
  ニシキ: Celio
  アキホ: Selphy
  マヨ: Lostelle
  つりおやじ: Fishing Guru
  レッド: {en: Red, note: The player. The name is the game's default; you type your own.}
  グリーン: {en: Green, note: "The rival, Professor Oak's grandson. The name is the Japanese game's default; the English games call him Blue."}
  オダマキ: {en: Birch, note: "Professor Birch of Hoenn, the region of Pokémon Ruby and Sapphire."}

team:
  ロケットだん: Team Rocket
  ロケットだんいん: Team Rocket Grunt

pokemon:
