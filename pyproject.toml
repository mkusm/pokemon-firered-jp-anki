[project]
name = "firered-anki"
version = "0.1.0"
description = "Japanese FireRed text to a story-ordered Anki deck"
authors = [
    { name = "Michał Kuśmierczyk", email = "kusm@protonmail.ch" }
]
requires-python = ">=3.10"
dependencies = [
    "fugashi>=1.5.2",
    "genanki>=0.13.1",
    "jamdict>=0.1a11.post2",
    "jamdict-data>=1.5",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "unidic-lite>=1.0.8",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
