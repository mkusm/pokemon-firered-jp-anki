# Script groups with no single map. Placed later by the first_seen_map stage
# (see the spec's Non-dialogue text section), not dumped at the start.
global:
  - event_scripts   # shared Pokémon Center, door and link-room lines
  - obtain_item     # "received X" lines
  - white_out
  - pc_transfer
  - repel
  - save
  - help_system
  - fame_checker    # device from the rival in Cerulean; entries unlock per person
  - flavor_text     # bookshelves, Town Map, TVs
  - cable_club      # link rooms, end of deck per the spec
  - VSSeeker        # trainers group; the VS Seeker comes from Vermilion

# Unreachable in FireRed or event-only: never carded.
exclude:
  - test                    # debug messages
  - berries                 # Ruby/Sapphire leftovers (Route104, Sootopolis…)
  - competitive_brothers    # Sootopolis leftover
  - eon_ticket              # event-only
  - mystery_event_club
  - mystery_event_msg
