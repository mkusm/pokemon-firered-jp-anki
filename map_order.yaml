# Play order for the FireRed JP deck. The one hand-maintained input.
#
# Each `order` entry is a map (e.g. PewterCity_Gym), a script group name
# (e.g. new_game_intro) or a label (e.g. Route22_Text_LateRivalIntro).
# A message goes to the longest entry matching its script group or the start
# of its label (whole `_`-separated parts only, so Route2 never matches Route21);
# the group wins ties. Label-prefix entries pull a map's later-story lines out
# to where they are actually seen. Within an entry, messages keep corpus order.
# Check coverage with: uv run python -m firered_anki.map_order
#
# Route: Bulbapedia's FireRed/LeafGreen walkthrough, Parts 1–21 (P1…P21 below):
# https://bulbapedia.bulbagarden.net/wiki/Walkthrough:Pok%C3%A9mon_FireRed_and_LeafGreen
# Kanto → Sevii 1–3 after Blaine → League → postgame Sevii 4–7 → Cerulean Cave.

